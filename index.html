<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Lakehouse Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-[650px]">
        <!-- Header -->
        <div class="bg-slate-800 text-white p-4">
            <h1 class="text-xl font-bold">Diretoria - Portal de Sinistros</h1>
            <p class="text-sm text-slate-300">Conectado ao Databricks SQL Warehouse via Agente IA (Fargate)</p>
        </div>

        <!-- Chat / Output Area -->
        <div id="output-box" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 text-sm">
            <div class="text-gray-500 italic text-center">
                O sistema está pronto. Insira sua credencial e digite sua pergunta abaixo para acionar o agente.
            </div>
        </div>

        <!-- Action Area (Input dinâmico) -->
        <div class="p-4 bg-white border-t border-gray-200 space-y-3">
            <div class="flex space-x-2">
                <!-- Novo campo de Senha (Token) -->
                <input type="password" id="auth-token" placeholder="Senha de Acesso" 
                       class="w-1/3 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700">
                
                <!-- Campo de Pergunta -->
                <input type="text" id="user-input" placeholder="Ex: Qual o valor total de sinistros?" 
                       class="w-2/3 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700">
            </div>
            
            <button id="ask-btn" onclick="callAgent()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center cursor-pointer">
                <span>Perguntar ao Agente</span>
            </button>
        </div>
    </div>

    <script>
        // Permite enviar a pergunta apertando "Enter" no campo de texto
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                callAgent();
            }
        });

        // Permite enviar a pergunta apertando "Enter" no campo de senha
        document.getElementById("auth-token").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                callAgent();
            }
        });

        async function callAgent() {
            const btn = document.getElementById('ask-btn');
            const outputBox = document.getElementById('output-box');
            const userInput = document.getElementById('user-input');
            const authTokenInput = document.getElementById('auth-token');
            
            // Captura os valores da tela
            const promptText = userInput.value.trim() || 'Qual é o valor total de sinistros?';
            const userToken = authTokenInput.value.trim();
            
            // Validação visual simples antes de enviar para a nuvem
            if (!userToken) {
                alert("Por favor, insira a Senha de Acesso antes de perguntar ao Agente.");
                authTokenInput.focus();
                return;
            }

            // Estado de Loading
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-gray-400');
            btn.classList.replace('hover:bg-blue-700', 'cursor-not-allowed');
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Orquestrando Fargate & Databricks (~75s)...`;
            
            // Imprime a pergunta do usuário na tela
            outputBox.innerHTML += `
                <div class="flex justify-start mt-4">
                    <div class="bg-blue-100 text-blue-900 p-3 rounded-lg rounded-tl-none max-w-[80%] shadow-sm">
                        <p class="font-bold mb-1">Diretoria:</p>
                        <p>${promptText}</p>
                    </div>
                </div>
                <div class="text-center text-xs text-gray-400 mt-2 animate-pulse">Iniciando container AWS ECS e processando Lakehouse...</div>
            `;
            
            // Rola a tela para baixo
            outputBox.scrollTop = outputBox.scrollHeight;

            try {
                // Chamada via POST para a sua Lambda Function URL
                const response = await fetch('https://lta7bg2ryjawwzcffy5jjnsokq0ahbph.lambda-url.us-east-1.on.aws/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-token-diretoria': userToken 
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                
                const json = await response.json();
                
                // Formatação do JSON de resposta (Separação Executiva vs Técnica)
                let debugLogsHtml = '';
                let execResponseHtml = '';
                let isExecResponse = false;

                json.data.forEach(line => {
                    let boldLine = line.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    
                    if (boldLine.startsWith('[ERRO')) {
                        // Erros críticos furam o bloqueio e aparecem na tela
                        execResponseHtml += `<p class="text-red-600 font-bold text-sm mt-3 border-l-4 border-red-500 pl-3 bg-red-50 py-2">${boldLine}</p>`;
                    } else if (boldLine.includes('[Agente - Resposta Executiva]')) {
                        // Marca o início da resposta para o Diretor
                        isExecResponse = true;
                    } else if (isExecResponse) {
                        // Tudo o que vem depois cai no balão principal
                        execResponseHtml += `<p class="mt-3 text-slate-800">${boldLine}</p>`;
                    } else {
                        // Logs de sistema, túnel JDBC e SQL ficam no background (modo hacker)
                        debugLogsHtml += `<p class="text-green-400 font-mono text-xs mt-1">${boldLine}</p>`;
                    }
                });

                // Monta o layout final sanfonado
                let finalHtml = '';
                
                if (debugLogsHtml) {
                    finalHtml += `
                        <details class="mb-4 bg-slate-800 rounded-lg p-2 border border-slate-700 shadow-inner group">
                            <summary class="cursor-pointer text-slate-300 text-xs font-semibold hover:text-white list-none flex items-center">
                                <svg class="w-4 h-4 mr-1 transform transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                <span>Logs de Processamento & Motor SQL</span>
                            </summary>
                            <div class="mt-3 p-3 bg-black rounded overflow-x-auto">
                                ${debugLogsHtml}
                            </div>
                        </details>
                    `;
                }

                if (execResponseHtml) {
                    finalHtml += `<div>${execResponseHtml}</div>`;
                }

                // Imprime a resposta do Agente
                outputBox.innerHTML += `
                    <div class="flex justify-end mt-4 mb-4">
                        <div class="bg-slate-200 p-4 rounded-lg rounded-tr-none max-w-[90%] shadow-sm border border-slate-300">
                            <p class="font-bold text-slate-700 mb-3 flex items-center">
                                <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM9 13H7V7h2v6zm4 0h-2V7h2v6z"></path></svg>
                                Agente Lakehouse:
                            </p>
                            ${finalHtml}
                        </div>
                    </div>
                `;

            } catch (error) {
                // Tratamento de falhas
                outputBox.innerHTML += `
                    <div class="flex justify-end mt-4 mb-4">
                        <div class="bg-red-100 text-red-700 p-3 rounded-lg rounded-tr-none max-w-[80%] shadow-sm border border-red-200">
                            <p class="font-bold">Erro de Conexão:</p>
                            <p>${error.message}</p>
                        </div>
                    </div>
                `;
            } finally {
                // Restaura o botão e limpa o input de texto
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-blue-600');
                btn.classList.replace('cursor-not-allowed', 'hover:bg-blue-700');
                btn.innerHTML = `<span>Perguntar ao Agente</span>`;
                userInput.value = '';
                // Mantemos o auth-token preenchido para não precisar redigitar
                outputBox.scrollTop = outputBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
